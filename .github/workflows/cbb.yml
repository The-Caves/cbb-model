name: CBB free model and website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'site/data.json'
  workflow_dispatch:
  schedule:
    # Basketball season only. UTC; approximately 8 AM and 7 PM ET.
    - cron: '17 13,0 * 11,12,1,2,3,4 *'
permissions:
  contents: read
concurrency:
  group: cbb-free-model-and-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only free open-source dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run score model and website leakage tests
        run: python -m pytest -q
      - name: Backfill seasons and train baseline on first run
        run: |
          if [ ! -s data/reports/backtest_2026.json ]; then
            python cbb.py bootstrap
          else
            echo 'Historical baseline found; reusing previously evaluated observations.'
          fi
      - name: Refresh source, freeze actual pre-tip picks, grade results
        run: python cbb.py daily
      - name: Generate real website data (no invented odds)
        run: python site_export.py --root data --site site
      - name: Persist public research evidence and site snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record observed CBB data, pretip forecasts and website evidence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Package website for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
          retention-days: 1
  deploy:
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy free static website
        id: deployment
        uses: actions/deploy-pages@v4
