name: CBB free model and website
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'site/data.json'
  workflow_dispatch:
  schedule:
    # Basketball season only. UTC times correspond roughly to midnight, 6 AM, noon and 6 PM Eastern in standard time.
    - cron: '17 11 * 11,12,1,2,3,4 *'
    - cron: '17 5,17,23 * 11,12,1,2,3,4 *'
permissions:
  contents: read
jobs:
  build:
    concurrency:
      group: cbb-safe-cbb-data-writer
      cancel-in-progress: false
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only free open-source dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run score model, identity, website and day-navigation tests
        run: |
          python -m pytest -q
          node --test tests/test_board.cjs
      - name: Fast-forward fresh verified main before data modifications
        # The previous CBB job may have committed a newer source snapshot
        # while this queued run was waiting. Refresh before writing data,
        # instead of trying to rebase conflicting JSON/CSV ledgers afterward.
        shell: bash
        run: |
          git fetch origin main
          git merge --ff-only origin/main
      - name: Backfill seasons and train baseline on first run
        run: |
          if [ ! -s data/reports/backtest_2026.json ]; then
            python cbb.py bootstrap
          else
            echo 'Historical baseline found; reusing previously evaluated observations.'
          fi
      - name: Compare previous-season weights on identical early-season matchups
        if: github.event_name == 'push'
        run: python prior_sensitivity.py --root data --season 2026
      - name: Compare revised historical score model without mixing model versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          if grep -q CBB_SCORE_RIDGE_V0_2 data/reports/backtest_2026.json && [ ! -f data/reports/backtest_2026_v02.json ]; then
            cp data/reports/backtest_2026.json data/reports/backtest_2026_v02.json
          fi
          python cbb.py backtest --season 2026
      - name: Evaluate D-I-only training challenger on fixed historical dates
        if: github.event_name == 'push'
        run: python d1_training_ablation.py --root data
      - name: Compare D-I margin shrinkage and prior-era weights (research only)
        if: github.event_name == 'push'
        run: python margin_shrinkage_ablation.py --root data
      - name: Refresh source, freeze actual pre-tip picks, grade results
        run: python cbb.py daily
      - name: Freeze independent v0.5 challengers before tip and grade matched games
        run: python v05_shadow.py --root data
      - name: Freeze experimental D-I second opinions strictly before tipoff
        run: python shadow_predictions.py --root data
      - name: Report independently observed scoreboard identity changes
        run: |
          if [ -s data/quarantine/identity_conflicts.json ]; then
            python -c 'import json; d=json.load(open("data/quarantine/identity_conflicts.json")); print(f"Identity disputes: {len(d)}; excluded from forecasts, training and grading")'
          fi
      - name: Report independently observed scoreboard score revisions
        shell: bash
        run: |
          if [ -s data/quarantine/score_revisions.json ]; then
            python -c 'import json; d=json.load(open("data/quarantine/score_revisions.json")); print(f"Unresolved source revisions: {len(d)}; excluded from predictions and grading")'
          fi
      - name: Verify multi-season boxscore coverage and as-of data quality
        run: python cbb_data_quality.py --root data
      - name: Collect actual current roster snapshots and verified prior player evidence
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.schedule == '17 11 * 11,12,1,2,3,4 *'
        run: python roster_intelligence.py --root data --max-teams 24 --player-backfill 24
      - name: Refresh roster research report without extra public API calls
        if: github.event_name != 'push' && github.event_name != 'workflow_dispatch' && github.event.schedule != '17 11 * 11,12,1,2,3,4 *'
        run: python roster_intelligence.py --root data --no-collect
      - name: Freeze genuine pretip roster-aware v0.5 challenger only when source-backed
        run: python roster_challenger.py --root data
      - name: Score-only versus possession challenger (no model promotion)
        # Deliberate PASS on thin historical data, never invent metrics.
        run: python efficiency_challenger.py --root data --season 2026
      - name: Train and compare residual factor challenger against v0.4 (research only)
        if: github.event_name == 'push'
        run: python factor_challenger.py --root data --season 2026
      - name: Replay v0.5 carryover and regularization candidates against v0.4
        if: github.event_name == 'push'
        run: python v05_transition_challenger.py --root data --season 2026
      - name: Generate as-of team schedule and Four Factors research profiles
        run: python team_intelligence.py --root data
      - name: Generate real website data (no invented odds)
        run: python site_export.py --root data --site site
      - name: Persist public research evidence and site snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record observed CBB data, pretip forecasts and website evidence [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Package website for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/
          retention-days: 1
  deploy:
    concurrency:
      group: cbb-live-website-publish
      cancel-in-progress: false
    if: github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy free static website
        id: deployment
        uses: actions/deploy-pages@v4
  backfill:
    needs: build
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 11 * 11,12,1,2,3,4 *')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: cbb-safe-cbb-data-writer
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free source dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect and persist three free historical boxscore batches (research only)
        # Up to 240 source requests per run; strict 1.2s pacing and bounded retries.
        # Commit each 80-game chunk to preserve progress if a later chunk fails.
        # No premium runners, paid API keys, or billing credentials.
        continue-on-error: true
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for chunk in 1 2 3; do
            echo "Collecting historical research chunk $chunk / 3"
            python boxscore_features.py --root data --max-games 80 --delay 1.2
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "Record CBB source-observed research batch $chunk [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          done
          # Bounded archive enrichment: scores and IDs are reverified, original
          # capture times remain unchanged, missing player rows are not guessed.
          python roster_intelligence.py --root data --no-collect --player-backfill 48
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified CBB historical player minutes [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
