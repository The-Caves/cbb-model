name: CBB source and UI checks
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'site/data.json'
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cbb-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: python -m compileall -q cbb.py team_directory.py cbb_data_quality.py site_export.py team_intelligence.py efficiency_challenger.py factor_challenger.py v05_transition_challenger.py v05_shadow.py roster_intelligence.py roster_challenger.py profile_history_audit.py profile_trajectory_challenger.py recency_challenger.py matchup_v05.py
      - name: Verify model, source data, frozen forecasts and website
        run: |
          python -m pytest -q
          node --test tests/test_board.cjs
